name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check lambdas tests scripts
          ruff format --check lambdas tests scripts
      - name: Pytest
        run: pytest -q

  terraform:
    name: Terraform validate and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init and validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: checkov
        run: |
          pip install checkov==3.3.25
          checkov -d terraform --framework terraform --compact --quiet --download-external-modules false
